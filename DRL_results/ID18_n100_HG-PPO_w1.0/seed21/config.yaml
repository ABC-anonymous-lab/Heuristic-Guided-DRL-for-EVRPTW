dataset:
  train_csv: ./example_dataset/n100/train/evrp_example_training_dataset.csv
  val_csv: ./example_dataset/n100/val/evrp_example_validation_dataset.csv
  test_csv: ./example_dataset/n100/test/evrp_example_test_dataset.csv
  graph_fraction: 1.0
train:
  RL_algo_name: HG_PPO
  trainer_class_path: algorithm.PPO.HG_PPO.HGPPOTrainer
  batch_size: 8
  num_epochs: 1
  eval_interval: 10
  repeat_each_graph: 1
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  ppo_epochs: 2
  max_grad_norm: 0.5
  normalize_advantage: true
  decode_mode: parallel
  loss_aggregation: mean_of_means
  repair_file_name: algorithm.OR_Tools_GLS_guidance.repair_balance
  ortools_repair_time_limit: 5
  balance_coefficient: 0
  vehicle_fixed_cost: 0
  use_gls_guided: true
  use_imitation_loss: true
  bc_max_weight: 0.2
  bc_min_weight: 0.05
  bc_temperature: 1.0
  bc_loss_aggregation: mean_of_means
  ortools_num_workers: 4
  ortools_worker_recycle_every: 25
logger:
  log_interval: 100
  output_root: ./outputs
  run_root: ./outputs/runs
  checkpoint_interval: 100
  min_served_threshold: 0.8
  max_plot_graphs: 2
  plot_random_seed: 42
  backup_paths:
  - ./env
  - ./algorithm
  - ./models
model:
  class_path: models.model_PPO.PPOGATPointerPolicyEnergy
  kwargs:
    d_model: 128
    n_heads: 8
    n_layers: 4
    dropout: 0.1
    edge_dim: 1
    tanh_clip: 6.0
  optimizer:
    name: adam
    lr: 0.0001
    weight_decay: 0.0
env:
  class_path: env.EVRP.EVRPEnv
  mask_function_path: env.mask_function.mask_function
  reward_function_path: env.reward_function.reward_function
  battery_max: 60.0
  charged_battery_max: 48
  n_vehicles: 3
  max_steps: 200
  distance_weight: 1.0
  charging_rate: 1.0
  energy_rate: 1.0
  speed: 60
  operating_time_min: 240
  operating_time_max: 1000
  time_windows:
  - - 240
    - 480
  - - 420
    - 660
  - - 600
    - 900
seed: 21

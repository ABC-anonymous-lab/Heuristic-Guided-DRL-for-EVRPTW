dataset:
  train_csv: ./example_dataset/n50/train/evrp_example_training_dataset.csv
  val_csv: ./example_dataset/n50/val/evrp_example_validation_dataset.csv
  test_csv: ./example_dataset/n50/test/evrp_example_test_dataset.csv
  graph_fraction: 1.0
train:
  RL_algo_name: HG_DDQN
  trainer_class_path: algorithm.DDQN.HG_DDQN.HGDDQNTrainer
  batch_size: 8
  num_epochs: 1
  eval_interval: 10
  repeat_each_graph: 1
  gamma: 0.99
  batch_size_for_learn: 32
  grad_steps_per_batch: 3
  buffer_capacity: 20000
  min_buffer_size: 2000
  target_update_freq: 2000
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 80000
  epsilon_limit_for_best_model: 0.5
  grad_clip: 1.0
  decode_mode: parallel
  loss_aggregation: mean_of_means
  rollout_mode: parallel
  repair_file_name: algorithm.OR_Tools_GLS_guidance.repair_balance
  ortools_repair_time_limit: 1
  use_gls_guided: true
  balance_coefficient: 0
  vehicle_fixed_cost: 0
  gls_repair_every_n_graphs: 1
  gls_buffer_capacity: 10000
  use_imitation_loss: true
  bc_batch_size: 32
  bc_max_weight: 0.2
  bc_min_weight: 0.05
  bc_temperature: 1.0
  bc_loss_aggregation: mean_of_means
  ortools_num_workers: 4
  ortools_worker_recycle_every: 25
logger:
  log_interval: 100
  output_root: ./outputs
  run_root: ./outputs/runs
  checkpoint_interval: 100
  min_served_threshold: 0.8
  max_plot_graphs: 2
  plot_random_seed: 42
  backup_paths:
  - ./env
  - ./algorithm
  - ./models
model:
  class_path: models.model_DDQN.DDQNGATPolicyEnergy
  kwargs:
    d_model: 128
    n_heads: 4
    n_layers: 4
    dropout: 0.1
    edge_dim: 1
  optimizer:
    name: adam
    lr: 0.0001
    weight_decay: 0.0
env:
  class_path: env.EVRP.EVRPEnv
  mask_function_path: env.mask_function.mask_function
  reward_function_path: env.reward_function.reward_function
  battery_max: 60.0
  charged_battery_max: 48
  n_vehicles: 2
  max_steps: 100
  distance_weight: 2.0
  charging_rate: 1.0
  energy_rate: 1.0
  speed: 60
  operating_time_min: 240
  operating_time_max: 1000
  time_windows:
  - - 240
    - 480
  - - 420
    - 660
  - - 600
    - 900
seed: 84
